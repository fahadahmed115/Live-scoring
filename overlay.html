
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRS CUES - TV Scoreboard</title>

<style>

:root {
    --gold: #d7ad55;
    --gold-light: #f4d58a;
    --white: #f6f2e8;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

#scoreboard {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    width: 58vw;
    max-width: 720px;
    background: rgba(5, 12, 9, 0.96);
    color: var(--white);
    border: 1px solid var(--gold);
    border-radius: 5px;
    overflow: hidden;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 9px;
    background: #0b563c;
    border-bottom: 1px solid var(--gold);
}

.brand {
    color: var(--gold-light);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 3px;
}

.live {
    font-size: 7px;
    font-weight: bold;
    color: white;
}

.live-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 3px;
    border-radius: 50%;
    background: #45e28a;
}

/* PLAYERS */

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.player {
    position: relative;
    min-width: 0;
    padding: 4px 8px;
    text-align: center;
}

.player + .player {
    border-left: 1px solid rgba(215,173,85,.4);
}

.player.active {
    background: rgba(215,173,85,.13);
}

.player.active::before {
    content: "";
    position: absolute;
    top: 0;
    left: 20%;
    width: 60%;
    height: 2px;
    background: var(--gold);
}

.at-table {
    display: none;
    color: var(--gold);
    font-size: 6px;
    font-weight: bold;
    margin-bottom: 2px;
}

.player.active .at-table {
    display: block;
}

.player-name {
    color: var(--white);
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.player.active .player-name {
    color: var(--gold-light);
}

.player-score {
    color: white;
    font-size: 25px;
    font-weight: 900;
    line-height: 1;
}

.player.active .player-score {
    color: var(--gold-light);
}

.player-info {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 3px;
    color: #ccc;
    font-size: 7px;
    font-weight: bold;
}

.player-info strong {
    color: var(--gold-light);
    margin-left: 3px;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 3px 6px;
    background: #101b15;
    border-top: 1px solid rgba(215,173,85,.4);
    color: var(--gold-light);
    font-size: 7px;
    font-weight: bold;
    letter-spacing: .5px;
}

.footer span {
    text-align: center;
}

/* WAITING */

#waiting {
    padding: 8px;
    text-align: center;
    color: var(--gold-light);
    font-size: 9px;
    letter-spacing: 1px;
}

/* CONNECTION */

#connection {
    position: absolute;
    top: 6px;
    right: 7px;
    padding: 3px 5px;
    background: rgba(0,0,0,.6);
    border-radius: 3px;
    color: #45e28a;
    font-size: 7px;
}

#connection.error {
    color: #ff7777;
}

/* MOBILE LANDSCAPE */

@media (max-width: 700px) {
    #scoreboard {
        width: 75vw;
    }

    .player-name {
        font-size: 10px;
    }

    .player-score {
        font-size: 22px;
    }
}

</style>
</head>

<body>

<div id="connection">CONNECTING...</div>

<div id="scoreboard">

    <div class="header">
        <div class="brand">RRR Cues</div>
        <div class="live">
            <span class="live-dot"></span> LIVE SCORE
        </div>
    </div>

    <div id="waiting">WAITING FOR MATCH</div>

    <div class="players" id="players" style="display:none">

        <div class="player" id="player1">
            <div class="at-table">● AT THE TABLE</div>
            <div class="player-name" id="name1">PLAYER 1</div>
            <div class="player-score" id="score1">0</div>
            <div class="player-info">
                <span>FRAMES<strong id="frames1">0</strong></span>
                <span>BREAK<strong id="break1">0</strong></span>
            </div>
        </div>

        <div class="player" id="player2">
            <div class="at-table">● AT THE TABLE</div>
            <div class="player-name" id="name2">PLAYER 2</div>
            <div class="player-score" id="score2">0</div>
            <div class="player-info">
                <span>FRAMES<strong id="frames2">0</strong></span>
                <span>BREAK<strong id="break2">0</strong></span>
            </div>
        </div>

    </div>

    <div class="footer">
        <span id="frame">FRAME 1</span>
        <span id="format">15 REDS | BEST OF 5</span>
        <span id="status">LIVE MATCH</span>
    </div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import { getAuth, signInAnonymously }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBMcKNgIMqHCWishymhmhQ12LOrXGONzvM",
    authDomain: "live-scoring-51bdc.firebaseapp.com",
    databaseURL: "https://live-scoring-51bdc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-scoring-51bdc",
    storageBucket: "live-scoring-51bdc.firebasestorage.app",
    messagingSenderId: "814952232826",
    appId: "1:814952232826:web:99ba2bb19d8a7b9481c8c3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const connection = document.getElementById("connection");

function showError(error) {
    connection.textContent = "CONNECTION ERROR";
    connection.classList.add("error");
    console.error(error);
}

signInAnonymously(auth)
.then(() => {

    const matchRef = ref(db, "matches/current");

    onValue(matchRef, (snapshot) => {

        const s = snapshot.val();

        connection.textContent = "● CONNECTED";
        connection.classList.remove("error");

        if (!s) {
            document.getElementById("waiting").style.display = "block";
            document.getElementById("players").style.display = "none";
            return;
        }

        document.getElementById("waiting").style.display = "none";
        document.getElementById("players").style.display = "grid";

        const names = s.names || [];
        const scores = s.scores || [];
        const frames = s.frames || [];
        const breaks = s.breaks || [];

        document.getElementById("name1").textContent =
            names[0] || "PLAYER 1";

        document.getElementById("name2").textContent =
            names[1] || "PLAYER 2";

        document.getElementById("score1").textContent =
            scores[0] ?? 0;

        document.getElementById("score2").textContent =
            scores[1] ?? 0;

        document.getElementById("frames1").textContent =
            frames[0] ?? 0;

        document.getElementById("frames2").textContent =
            frames[1] ?? 0;

        document.getElementById("break1").textContent =
            breaks[0] ?? 0;

        document.getElementById("break2").textContent =
            breaks[1] ?? 0;

        document.getElementById("player1").classList.toggle(
            "active", s.active === 0
        );

        document.getElementById("player2").classList.toggle(
            "active", s.active === 1
        );

        document.getElementById("frame").textContent =
            "FRAME " + (s.frame ?? 1);

        document.getElementById("format").textContent =
            (s.format || "15 Reds") +
            " | BEST OF " + (s.bestOf || 5);

        document.getElementById("status").textContent =
            s.over ? "MATCH OVER" : "LIVE MATCH";

    }, showError);

})
.catch(showError);
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRS CUES - TV Scoreboard</title>

<style>
:root {
    --gold: #d7ad55;
    --gold-light: #f4d58a;
    --dark: #101719;
    --green: #174c43;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

#scoreboard {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(12, 20, 22, .97);
    color: var(--white);
    border-top: 2px solid #d7ad55;
}

.header {
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: #174c43;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
}
    .live-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff3030;
    box-shadow: 0 0 6px #ff3030;
    animation: livePulse 1.2s infinite;
}

@keyframes livePulse {
    50% {
        opacity: .35;
    }
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
}

.player {
    position: relative;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    align-items: center;
    padding: 4px 14px;
    column-gap: 12px;
}

.player + .player {
    border-left: 1px solid rgba(255,255,255,.4);
}

.player.active {
    background: rgba(23, 76, 67, .65);
}

.player.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #d7ad55;
}

.at-table {
    display: none;
}

.player.active .at-table {
    display: block;
    grid-column: 1 / -1;
    color: var(--gold-light);
    font-size: 7px;
    font-weight: bold;
}

.player-name {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    color: white;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player.active .player-name {
    color: var(--gold-light);
}

.player-score {
    grid-column: 2;
    grid-row: 1;
    color: white;
    font-size: 25px;
    line-height: 1;
    font-weight: 900;
}

.player-score::before {
    content: "SCORE ";
    font-size: 7px;
    color: #b9c5c2;
}

.player-info {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    align-items: center;
    gap: 13px;
    margin-top: 3px;
    color: #d7ad55;
    font-size: 8px;
    font-weight: 800;
    white-space: nowrap;
}

.player-info strong {
    color: white;
    margin-left: 3px;
}

.footer {
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: #174c43;
    color: white;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .5px;
}

@media (max-width: 600px) {
    .player {
        padding: 3px 7px;
        column-gap: 5px;
    }

    .player-name {
        font-size: 9px;
    }

    .player-score {
        font-size: 19px;
    }

    .player-info {
        font-size: 7px;
        gap: 7px;
    }
    /* PORTRAIT MODE */
@media screen and (orientation: portrait) {
    #scoreboard {
        width: 100%;
        bottom: 0;
    }

    .header {
        height: 20px;
        padding: 0 8px;
        font-size: 9px;
    }

    .player {
        padding: 5px 6px;
        column-gap: 4px;
    }

    .player-name {
        font-size: 10px;
    }

    .player-score {
        font-size: 21px;
    }

    .player-score::before {
        font-size: 6px;
    }

    .player-info {
        font-size: 7px;
        gap: 6px;
    }

    .footer {
        height: 19px;
        padding: 0 7px;
        font-size: 7px;
    }
}

/* VERY NARROW PORTRAIT SCREENS */
@media screen and (orientation: portrait) and (max-width: 400px) {
    .player {
        padding: 4px 4px;
    }

    .player-name {
        font-size: 8px;
    }

    .player-score {
        font-size: 18px;
    }

    .player-info {
        font-size: 6px;
        gap: 4px;
    }
}
}
</style>
</head>

<body>

<div id="connection">CONNECTING...</div>

<div id="scoreboard">

    <div class="header">
        <div class="brand">RRR Cues</div>
        <div class="live">
            <span class="live-dot"></span> LIVE SCORE
        </div>
    </div>

    <div id="waiting">WAITING FOR MATCH</div>

    <div class="players" id="players" style="display:none">

        <div class="player" id="player1">
            <div class="at-table">● AT THE TABLE</div>
            <div class="player-name" id="name1">PLAYER 1</div>
            <div class="player-score" id="score1">0</div>
            <div class="player-info">
                <span>FRAMES<strong id="frames1">0</strong></span>
                <span>BREAK<strong id="break1">0</strong></span>
            </div>
        </div>

        <div class="player" id="player2">
            <div class="at-table">● AT THE TABLE</div>
            <div class="player-name" id="name2">PLAYER 2</div>
            <div class="player-score" id="score2">0</div>
            <div class="player-info">
                <span>FRAMES<strong id="frames2">0</strong></span>
                <span>BREAK<strong id="break2">0</strong></span>
            </div>
        </div>

    </div>

    <div class="footer">
        <span id="frame">FRAME 1</span>
        <span id="format">15 REDS | BEST OF 5</span>
        <span id="status">LIVE MATCH</span>
    </div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import { getAuth, signInAnonymously }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBMcKNgIMqHCWishymhmhQ12LOrXGONzvM",
    authDomain: "live-scoring-51bdc.firebaseapp.com",
    databaseURL: "https://live-scoring-51bdc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "live-scoring-51bdc",
    storageBucket: "live-scoring-51bdc.firebasestorage.app",
    messagingSenderId: "814952232826",
    appId: "1:814952232826:web:99ba2bb19d8a7b9481c8c3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const connection = document.getElementById("connection");

function showError(error) {
    connection.textContent = "CONNECTION ERROR";
    connection.classList.add("error");
    console.error(error);
}

signInAnonymously(auth)
.then(() => {

    const matchRef = ref(db, "matches/current");

    onValue(matchRef, (snapshot) => {

        const s = snapshot.val();

        connection.textContent = "● CONNECTED";
        connection.classList.remove("error");

        if (!s) {
            document.getElementById("waiting").style.display = "block";
            document.getElementById("players").style.display = "none";
            return;
        }

        document.getElementById("waiting").style.display = "none";
        document.getElementById("players").style.display = "grid";

        const names = s.names || [];
        const scores = s.scores || [];
        const frames = s.frames || [];
        const breaks = s.breaks || [];

        document.getElementById("name1").textContent =
            names[0] || "PLAYER 1";

        document.getElementById("name2").textContent =
            names[1] || "PLAYER 2";

        document.getElementById("score1").textContent =
            scores[0] ?? 0;

        document.getElementById("score2").textContent =
            scores[1] ?? 0;

        document.getElementById("frames1").textContent =
            frames[0] ?? 0;

        document.getElementById("frames2").textContent =
            frames[1] ?? 0;

        document.getElementById("break1").textContent =
            breaks[0] ?? 0;

        document.getElementById("break2").textContent =
            breaks[1] ?? 0;

        document.getElementById("player1").classList.toggle(
            "active", s.active === 0
        );

        document.getElementById("player2").classList.toggle(
            "active", s.active === 1
        );

        document.getElementById("frame").textContent =
            "FRAME " + (s.frame ?? 1);

        document.getElementById("format").textContent =
            (s.format || "15 Reds") +
            " | BEST OF " + (s.bestOf || 5);

        document.getElementById("status").textContent =
            s.over ? "MATCH OVER" : "LIVE MATCH";

    }, showError);

})
.catch(showError);
</script>

</body>
</html>

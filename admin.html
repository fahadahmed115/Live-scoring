
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Snooker Scoring</title>
<style>
:root{--gold:#d7ad55;--dark:#080b0a;--white:#f6f2e8}
*{box-sizing:border-box}
body{margin:0;background:var(--dark);color:var(--white);font-family:Arial,sans-serif}
header{text-align:center;padding:22px;border-bottom:1px solid #39443c}
header h1{color:var(--gold);letter-spacing:5px;margin:0}
header p{color:#aaa;font-size:12px;letter-spacing:2px}
main{max-width:950px;margin:25px auto;padding:15px}
.panel{background:#131b17;border:1px solid #344238;border-radius:12px;padding:20px;margin-bottom:18px}
input,select{width:100%;padding:12px;margin:7px 0 14px;background:#080d0b;color:white;border:1px solid #455348;border-radius:7px}
label{color:var(--gold);font-size:12px}
button{padding:12px 16px;margin:4px;border:none;border-radius:7px;background:var(--gold);color:#111;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:#29382e;color:white}
.danger{background:#792f29;color:white}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.player{padding:20px 8px;background:#17251d;border-radius:10px;border:1px solid #344238}
.player.active{border:2px solid var(--gold)}
.player h2{font-size:20px;overflow-wrap:anywhere}
.score{font-size:65px;font-weight:bold;color:var(--gold)}
.frames{color:#aaa}
.ball-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ball-grid button{min-height:65px}
.red{background:#a52d2d;color:white}
.yellow{background:#b99a27}
.green{background:#176b43;color:white}
.brown{background:#754b2d;color:white}
.blue{background:#245c9b;color:white}
.pink{background:#b65d83;color:white}
.black{background:#050505;color:white;border:1px solid #777}
.status{color:#aaa;margin-top:15px;font-size:13px}
@media(max-width:500px){.score{font-size:48px}.player h2{font-size:16px}.ball-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<h1></h1>
<p>SNOOKER CLUB • LIVE SCORING</p>
</header>

<main>
<section class="panel">
<h3>Match Setup</h3>
<label>Player 1</label>
<input id="player1" value="Player 1">
<label>Player 2</label>
<input id="player2" value="Player 2">
<label>Match Format</label>
<select id="format">
<option>15 Reds</option>
<option>6 Reds</option>
</select>
<label>Match Type</label>
<select id="bestOf">
<option value="3">Best of 3</option>
<option value="5" selected>Best of 5</option>
<option value="7">Best of 7</option>
<option value="9">Best of 9</option>
</select>
<button id="start">START MATCH</button>
</section>

<section class="panel">
<div class="players">
<div class="player active" id="box0">
<h2 id="name0">Player 1</h2>
<div class="score" id="score0">0</div>
<div class="frames">Frames: <span id="frames0">0</span></div>
<p id="break0">Break: 0</p>
<small id="turn0">AT THE TABLE</small>
</div>
<div class="player" id="box1">
<h2 id="name1">Player 2</h2>
<div class="score" id="score1">0</div>
<div class="frames">Frames: <span id="frames1">0</span></div>
<p id="break1">Break: 0</p>
<small id="turn1">WAITING</small>
</div>
</div>
<p id="matchInfo" style="text-align:center;color:#d7ad55">15 REDS • BEST OF 5 • FRAME 1</p>
</section>

<section class="panel">
<h3>Ball Scoring</h3>
<div class="ball-grid">
<button class="red" data-points="1" data-ball="Red">RED +1</button>
<button class="yellow" data-points="2" data-ball="Yellow">YELLOW +2</button>
<button class="green" data-points="3" data-ball="Green">GREEN +3</button>
<button class="brown" data-points="4" data-ball="Brown">BROWN +4</button>
<button class="blue" data-points="5" data-ball="Blue">BLUE +5</button>
<button class="pink" data-points="6" data-ball="Pink">PINK +6</button>
<button class="black" data-points="7" data-ball="Black">BLACK +7</button>
</div>
<h3>Fouls</h3>
<button class="secondary" data-foul="4">FOUL 4</button>
<button class="secondary" data-foul="5">FOUL 5</button>
<button class="secondary" data-foul="6">FOUL 6</button>
<button class="secondary" data-foul="7">FOUL 7</button>
<hr style="border-color:#344238;margin:20px 0">
<button id="changeTurn">CHANGE TURN</button>
<button class="secondary" id="undo">UNDO</button>
<button class="secondary" id="endFrame">END FRAME</button>
<button class="danger" id="reset">RESET MATCH</button>
<p class="status" id="status">Connecting to Firebase...</p>
</section>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,signInAnonymously}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,onValue,runTransaction}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBMcKNgIMqHCWishymhmhQ12LOrXGONzvM",
authDomain:"live-scoring-51bdc.firebaseapp.com",
databaseURL:"https://live-scoring-51bdc-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"live-scoring-51bdc",
storageBucket:"live-scoring-51bdc.firebasestorage.app",
messagingSenderId:"814952232826",
appId:"1:99ba2bb19d8a7b9481c8c3"
};

// Correct Firebase app ID
firebaseConfig.appId="1:814952232826:web:99ba2bb19d8a7b9481c8c3";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const matchRef=ref(db,"matches/current");

let game=null;
let ready=false;

const $=id=>document.getElementById(id);

function blank(){
return {
names:["Player 1","Player 2"],
scores:[0,0],
frames:[0,0],
breaks:[0,0],
active:0,
frame:1,
bestOf:5,
format:"15 Reds",
over:false,
history:[]
};
}

function render(g){
game=g;

for(let i=0;i<2;i++){
$("name"+i).textContent=g.names[i];
$("score"+i).textContent=g.scores[i];
$("frames"+i).textContent=g.frames[i];
$("break"+i).textContent="Break: "+g.breaks[i];
$("box"+i).classList.toggle("active",g.active===i);
$("turn"+i).textContent=g.active===i?"AT THE TABLE":"WAITING";
}

$("matchInfo").textContent=
g.format.toUpperCase()+" • BEST OF "+g.bestOf+" • FRAME "+g.frame+
(g.over?" • MATCH COMPLETE":"");

$("status").textContent=g.over
?"MATCH COMPLETE"
:"CONNECTED • LIVE SCORE SYNC";

document.querySelectorAll("button").forEach(b=>{
if(b.id!=="reset" && b.id!=="start")b.disabled=!ready||!g||g.over;
});
$("start").disabled=!ready;
}

function snapshot(g){
return {
names:[...g.names],
scores:[...g.scores],
frames:[...g.frames],
breaks:[...g.breaks],
active:g.active,
frame:g.frame,
bestOf:g.bestOf,
format:g.format,
over:g.over,
history:[]
};
}

async function update(action){
if(!ready||!game||game.over)return;

try{
const result=await runTransaction(matchRef,current=>{
if(!current||current.over)return;
const g={...current};
g.names=[...current.names];
g.scores=[...current.scores];
g.frames=[...current.frames];
g.breaks=[...current.breaks];
g.history=[...(current.history||[])];

g.history.push(snapshot(current));
if(g.history.length>30)g.history.shift();

action(g);
return g;
});
if(!result.committed)$("status").textContent="No change made.";
}catch(e){
$("status").textContent="UPDATE ERROR: "+e.message;
}
}

$("start").onclick=async()=>{
if(!ready)return;
const g=blank();
g.names=[
$("player1").value.trim()||"Player 1",
$("player2").value.trim()||"Player 2"
];
g.format=$("format").value;
g.bestOf=Number($("bestOf").value);

try{
await runTransaction(matchRef,()=>g);
}catch(e){$("status").textContent="ERROR: "+e.message;}
};

document.querySelectorAll("[data-points]").forEach(button=>{
button.onclick=()=>update(g=>{
const p=g.active;
const points=Number(button.dataset.points);
g.scores[p]+=points;
g.breaks[p]+=points;
});
});

document.querySelectorAll("[data-foul]").forEach(button=>{
button.onclick=()=>update(g=>{
const points=Number(button.dataset.foul);
const opponent=1-g.active;
g.scores[opponent]+=points;
g.breaks[g.active]=0;
g.active=opponent;
});
});

$("changeTurn").onclick=()=>update(g=>{
g.breaks[g.active]=0;
g.active=1-g.active;
});

$("undo").onclick=async()=>{
if(!ready)return;
const result=await runTransaction(matchRef,current=>{
if(!current||!current.history||!current.history.length)return;
const history=[...current.history];
const previous=history.pop();
return {...previous,history};
});
if(!result.committed)$("status").textContent="Nothing to undo.";
};

$("endFrame").onclick=()=>update(g=>{
if(g.scores[0]===g.scores[1]){
g.history.pop();
return;
}
const winner=g.scores[0]>g.scores[1]?0:1;
g.frames[winner]++;
const target=Math.floor(g.bestOf/2)+1;
g.over=g.frames[winner]>=target;
g.scores=[0,0];
g.breaks=[0,0];
g.active=0;
if(!g.over)g.frame++;
});

$("reset").onclick=async()=>{
if(!ready)return;
if(confirm("Reset the entire match?")){
await runTransaction(matchRef,()=>blank());
}
};

signInAnonymously(auth).then(async()=>{
onValue(matchRef,snap=>{
if(snap.exists())render(snap.val());
else render(blank());
});
ready=true;
$("status").textContent="CONNECTED TO FIREBASE";
$("start").disabled=false;
}).catch(error=>{
$("status").textContent="FIREBASE ERROR: "+error.message;
});
</script>
</body>
</html>
